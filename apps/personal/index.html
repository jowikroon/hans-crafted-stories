    <!-- Skin preset init, set data-skin on <html> before paint to avoid FOUC.
         Source of truth = localStorage 'writing_skin'. Default 'editorial-light' (base).
         Altijd licht starten: een opgeslagen donkere skin (mono-dark) wordt bij het laden genegeerd.
         Twin: src/hooks/useSkin.ts (LIGHT_SKINS). -->
    <script>
      (function(){
        try{
          var s = localStorage.getItem('writing_skin');
          if (s === 'paper' || s === 'slate' || s === 'comfy') document.documentElement.setAttribute('data-skin', s);
        }catch(e){}
      })();
    </script>
    <!-- Tracking audit: only GTM loads in head. GA4, Hotjar, and other scripts are configured inside GTM or loaded deferred via TrackingScriptInjector (after first user interaction) to reduce CWV impact. -->
    <!-- dataLayer init (must be before GTM) -->
    <script>
      // Consent Mode v2 default, MUST run synchronously here, BEFORE GTM loads,
      // so Google tags boot with consent state already set. Previously the default
      // was pushed from a React component after mount (too late) -> analytics_storage
      // stayed denied and GA4 collected almost nothing ("0% granted").
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;
      (function(){
        var EEA = ["BE","BG","CZ","DK","DE","EE","IE","EL","ES","FR","HR","IT","CY","LV","LT","LU","HU","MT","NL","AT","PL","PT","RO","SI","SK","FI","SE","IS","LI","NO"];
        gtag('consent','default',{
          ad_storage:'denied', ad_user_data:'denied', ad_personalization:'denied',
          analytics_storage:'denied', functionality_storage:'denied',
          personalization_storage:'denied', security_storage:'granted',
          wait_for_update: 500, region: EEA
        });
        var stored = null; try { stored = localStorage.getItem('cookie_consent'); } catch(e){}
        if (stored === 'accepted') {
          gtag('consent','update',{
            ad_storage:'granted', ad_user_data:'granted', ad_personalization:'granted',
            analytics_storage:'granted', functionality_storage:'granted', personalization_storage:'granted'
          });
        }
      })();
    </script>
