<!doctype html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Album gallery preview review</title><style>
*{box-sizing:border-box}body{margin:0;background:#222;color:#fff;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;position:sticky;top:0;background:#222;z-index:1}button{padding:10px;border:1px solid #aaa;border-radius:4px;cursor:pointer}button:focus-visible{outline:3px solid #bf92ff}label{display:flex;gap:7px;align-items:center}select{padding:8px}main{display:flex;justify-content:center;padding:16px;overflow:auto}iframe{border:1px solid #aaa;flex:none;width:390px;height:844px;background:#122b24}output{margin-left:auto}
</style></head><body><header><strong>Responsive gallery review</strong><button data-width="320" data-height="568">320 × 568</button><button data-width="390" data-height="844">390 × 844</button><button data-width="768" data-height="1024">768 × 1024</button><button data-width="844" data-height="390">844 × 390</button><button data-width="1280" data-height="800">1280 × 800</button><label>View<select id="view"><option value="/music/albums/iets-moois/brand#album-world">Story</option><option value="/music/albums/iets-moois/brand?beeld=toen-in-nu#album-world">Gallery</option><option value="/music/albums/iets-moois/brand?beeld=volgordestudie-03#album-world">Sequence study</option></select></label><output id="size">390 × 844</output></header><main><iframe title="Album preview" src="/music/albums/iets-moois/brand#album-world"></iframe></main><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';frame.style.height=button.dataset.height+'px';document.querySelector('#size').textContent=button.textContent}));document.querySelector('#view').addEventListener('change',event=>frame.src=event.target.value);
</script></body></html>
