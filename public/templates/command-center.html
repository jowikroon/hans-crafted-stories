<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HansAI — Command Center Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070B;
    --bg-raised: #0C0C14;
    --bg-input: #09090F;
    --border: #12121E;
    --border-hover: #1A1A28;
    --text: #A0A4AA;
    --text-bright: #E8E8F0;
    --text-dim: #3A3A4A;
    --accent: #10B981;
    --accent-dim: rgba(16,185,129,0.6);
    --accent-bg: rgba(16,185,129,0.1);
    --accent-bg2: rgba(16,185,129,0.05);
    --error: #EF4444;
    --orange: #F97316;
    --font: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  }

  body {
    font-family: var(--font);
    font-size: 12px;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Pipeline Bar ────────────────────────────── */
  .pipeline-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
  }
  .pipeline-bar.hidden { display: none; }
  .pipeline-step {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    transition: all .3s;
  }
  .pipeline-step.active { color: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
  .pipeline-step.done { color: #6EE7B7; }
  .pipeline-sep { font-size: 8px; letter-spacing: 3px; color: rgba(255,255,255,0.06); }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Header ──────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    background: linear-gradient(180deg, #0C0C14 0%, #09090F 100%);
    border-bottom: 1px solid var(--border);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--accent-bg);
    font-size: 14px;
  }
  .header-title { font-size: 12px; font-weight: 600; color: var(--text-bright); }
  .header-sub { font-size: 9px; color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 6px; }

  /* ── Model Picker ────────────────────────────── */
  .model-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-hover);
    background: var(--bg-raised);
    color: var(--text);
    font-size: 10px;
    font-family: var(--font);
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .model-btn:hover { border-color: var(--accent); }
  .model-btn .bot-icon { color: rgba(16,185,129,0.8); }
  .model-dropdown {
    position: absolute; right: 0; top: 100%;
    margin-top: 6px;
    width: 208px;
    border-radius: 12px;
    border: 1px solid var(--border-hover);
    background: var(--bg-raised);
    padding: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
  }
  .model-dropdown.open { display: block; }
  .model-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 11px;
    font-family: var(--font);
    cursor: pointer;
    transition: all .2s;
  }
  .model-option:hover { background: var(--bg-input); color: var(--text-bright); }
  .model-option.selected { color: var(--accent); }
  .model-tag {
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-input);
    font-size: 8px;
    font-weight: 700;
  }

  .icon-btn {
    padding: 6px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: rgba(160,164,170,0.4);
    cursor: pointer;
    transition: all .2s;
    font-size: 12px;
  }
  .icon-btn:hover { color: var(--text-bright); }
  .icon-btn.active { color: var(--accent); background: var(--accent-bg); }

  /* ── Category Tabs ───────────────────────────── */
  .category-nav {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    padding: 4px 16px;
    background: #08080E;
    scrollbar-width: none;
  }
  .category-nav::-webkit-scrollbar { display: none; }
  .cat-tab {
    white-space: nowrap;
    padding: 6px 10px;
    border-radius: 6px 6px 0 0;
    font-size: 10px;
    font-weight: 400;
    font-family: var(--font);
    border: none;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .2s;
  }
  .cat-tab:hover { color: inherit; }
  .cat-tab.active { font-weight: 600; }

  /* ── Main Content ────────────────────────────── */
  .main-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── Action Drawer ───────────────────────────── */
  .action-drawer {
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-hover);
    background: var(--bg-raised);
    padding: 12px;
    display: none;
    animation: slideDown .2s ease-out;
  }
  .action-drawer.open { display: block; }

  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .hero-card {
    border-radius: 8px;
    border: 1px solid var(--border-hover);
    background: var(--bg-input);
    padding: 12px;
    text-align: left;
    cursor: pointer;
    transition: all .2s;
    font-family: var(--font);
  }
  .hero-card:hover { transform: scale(1.01); border-color: var(--accent); }
  .hero-card h4 { font-size: 12px; font-weight: 600; color: var(--text-bright); margin-bottom: 4px; }
  .hero-card p { font-size: 10px; color: var(--text); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tool-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tool-tag { padding: 2px 6px; border-radius: 4px; background: var(--bg); font-size: 8px; color: var(--text); }

  .compact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    font-family: var(--font);
    color: var(--text);
  }
  .compact-row:hover { background: var(--bg-input); color: var(--text-bright); }
  .compact-row .label { font-size: 11px; font-weight: 500; }
  .compact-row .sub { font-size: 10px; opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .history-sep {
    display: flex; align-items: center; gap: 8px;
    margin: 8px 0;
    color: rgba(16,185,129,0.3);
  }
  .history-sep .line { flex: 1; height: 1px; background: currentColor; }
  .history-sep span { font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

  .history-row {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all .2s;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    font-family: var(--font);
    color: rgba(160,164,170,0.5);
    font-size: 10px;
  }
  .history-row:hover { color: var(--text-bright); }
  .history-row .cmd { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-row .ago { flex-shrink: 0; font-size: 9px; }

  /* ── Delivery Picker ─────────────────────────── */
  .delivery-picker {
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-hover);
    background: var(--bg-raised);
    padding: 12px;
    display: none;
    animation: slideDown .2s ease-out;
  }
  .delivery-picker.open { display: block; }
  .delivery-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-dim); margin-bottom: 8px; }

  .delivery-option {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 6px;
    font-family: var(--font);
    color: var(--text);
  }
  .delivery-option:hover { border-color: var(--accent); }
  .delivery-option.best { border-color: rgba(16,185,129,0.3); }
  .delivery-option .icon { font-size: 18px; }
  .delivery-option .dlabel { font-size: 12px; font-weight: 500; color: var(--text-bright); }
  .delivery-option .dnote { font-size: 10px; color: var(--text); }
  .delivery-option .best-badge {
    margin-left: auto;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(16,185,129,0.2);
    color: var(--accent);
    font-size: 8px;
    font-weight: 700;
  }
  .back-btn {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: var(--font);
  }
  .back-btn:hover { color: var(--text-bright); }

  /* ── Messages ────────────────────────────────── */
  .message {
    margin-bottom: 8px;
    max-width: 85%;
  }
  .message.user { margin-left: auto; text-align: right; }
  .message .bubble {
    display: inline-block;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.6;
    text-align: left;
  }
  .message.user .bubble { background: rgba(16,185,129,0.1); color: #6EE7B7; }
  .message.assistant .bubble { color: var(--text-bright); }
  .message.system .bubble { color: var(--text); }
  .message.workflow .bubble { background: var(--accent-bg2); color: #6EE7B7; }
  .message.error .bubble { background: rgba(239,68,68,0.1); color: var(--error); }

  .message .bubble code {
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg-input);
    font-family: var(--font);
    font-size: 11px;
    color: var(--accent);
  }
  .message .bubble strong { font-weight: 600; }

  /* ── Exec spinner ────────────────────────────── */
  .exec-spinner {
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .exec-spinner.visible { display: flex; }
  .exec-spinner .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .exec-spinner span { font-size: 12px; color: var(--text); }

  /* ── Thinking indicator ──────────────────────── */
  .thinking { display: none; align-items: center; gap: 8px; margin-bottom: 8px; }
  .thinking.visible { display: flex; }
  .thinking .spinner {
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .thinking span { font-size: 10px; color: var(--text); }

  /* ── Input Bar ───────────────────────────────── */
  .input-bar {
    flex-shrink: 0;
    padding: 8px 16px 12px;
    background: var(--bg);
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 768px;
    margin: 0 auto;
  }
  .prompt-char { font-size: 10px; color: var(--accent-dim); }
  .input-field {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: var(--font);
    font-size: 12px;
    color: var(--text);
  }
  .input-field::placeholder { color: rgba(160,164,170,0.4); }
  .send-btn {
    padding: 8px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: rgba(160,164,170,0.2);
    cursor: pointer;
    transition: all .2s;
    font-size: 14px;
  }
  .send-btn.active { color: var(--accent); }

  /* ── History Panel ───────────────────────────── */
  .history-panel {
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid var(--border-hover);
    background: var(--bg-raised);
    padding: 8px;
    display: none;
  }
  .history-panel.open { display: block; }
  .history-panel .title { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(160,164,170,0.6); margin-bottom: 4px; }
  .history-panel .entry {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text);
    transition: all .2s;
  }
  .history-panel .entry:hover { background: var(--bg-input); color: var(--text-bright); }
  .history-panel .entry .preview { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-panel .entry .date { flex-shrink: 0; font-size: 9px; color: rgba(160,164,170,0.4); }

  /* ── Footer credit ───────────────────────────── */
  .template-credit {
    padding: 8px 16px;
    text-align: center;
    font-size: 9px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }
  .template-credit a { color: var(--accent); text-decoration: none; }
  .template-credit a:hover { text-decoration: underline; }

  /* Responsive */
  @media (max-width: 640px) {
    .hero-grid { grid-template-columns: 1fr; }
    .pipeline-step span { display: none; }
  }
</style>
</head>

<!-- Pipeline Bar -->
<div class="pipeline-bar hidden" id="pipeline">

</div>

<!-- Category Tabs -->
<nav class="category-nav" id="cat-nav"></nav>

<!-- Main Content -->
<div class="main-content" id="main-content">

    <div class="title">History</div>
    <div id="history-entries"></div>
  </div>
  <div class="action-drawer" id="action-drawer"></div>

</div>

<!-- Input Bar -->
<div class="input-bar">

    <span class="prompt-char">$</span>
    <input class="input-field" id="input" placeholder="Type a command or ask anything…" autocomplete="off">
    <button class="send-btn" id="send-btn">➤</button>
  </div>
</div>

<!-- Credit -->
<div class="template-credit">
  HansAI Command Center Template · <a href="https://hansvanleeuwen.com" target="_blank">hansvanleeuwen.com</a>

const AI_MODELS = [
  { id: "gemini-3-flash", label: "Gemini 3 Flash", tag: "Fast" },

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let state = {
  activeCat: null,
  pickedAction: null,
  phase: "browse", // browse | delivery | exec
  selectedModel: AI_MODELS[0].id,
  messages: [
    { role: "system", content: "HansAI Command Center v2.0 — Template" },
    { role: "system", content: 'Type /help to see available commands, or click a category tab above.' },
  ],
  chatHistory: [],
  showHistory: false,
  showModelPicker: false,
};

// ══════════════════════════════════════════════════════════════
// RENDER FUNCTIONS
// ══════════════════════════════════════════════════════════════

function renderCategoryTabs() {
  const nav = document.getElementById("cat-nav");
  nav.innerHTML = "";
  for (const [key, cat] of Object.entries(CATEGORIES)) {
    const btn = document.createElement("button");
    btn.className = "cat-tab" + (state.activeCat === key ? " active" : "");
    btn.textContent = cat.icon + " " + cat.label;
    btn.style.cssText = state.activeCat === key
      ? `color:${cat.color};border-bottom-color:${cat.color};background:${cat.color}12;`
      : "";
    btn.onmouseenter = () => { if (state.activeCat !== key) btn.style.color = cat.color; };
    btn.onmouseleave = () => { if (state.activeCat !== key) btn.style.color = ""; };
    btn.onclick = () => {
      if (state.phase === "delivery" || state.phase === "exec") return;
      state.activeCat = state.activeCat === key ? null : key;
      state.pickedAction = null;
      state.phase = "browse";
      render();
    };
    nav.appendChild(btn);
  }
}

function renderActionDrawer() {
  const el = document.getElementById("action-drawer");
  if (!state.activeCat || !ACTIONS[state.activeCat] || state.phase !== "browse") {
    el.className = "action-drawer"; return;
  }
  const acts = ACTIONS[state.activeCat];
  let html = '<div class="hero-grid">';
  for (const a of acts.hero) {
    html += `<div class="hero-card" onclick="pickAction('${a.id}')">
      <h4>${a.label}</h4><p>${a.sub}</p>
      <div class="tool-tags">${a.tools.map(t => `<span class="tool-tag">${t}</span>`).join("")}</div>
    </div>`;
  }
  html += '</div>';
  for (const a of acts.compact) {
    html += `<button class="compact-row" onclick="pickAction('${a.id}')">
      <span class="label">${a.label}</span><span class="sub">${a.sub}</span>
    </button>`;
  }
  if (acts.history.length) {
    html += '<div class="history-sep"><div class="line"></div><span>Last Run — Verified</span><div class="line"></div></div>';
    for (const h of acts.history) {
      html += `<button class="history-row" onclick="rerunHistory('${h.cmd.replace(/'/g,"\\'")}')">
        <span class="cmd">${h.cmd}</span><span class="ago">${h.ago}</span>
      </button>`;
    }
  }
  el.innerHTML = html;
  el.className = "action-drawer open";
}

function renderDeliveryPicker() {
  const el = document.getElementById("delivery-picker");
  if (state.phase !== "delivery" || !state.pickedAction) { el.className = "delivery-picker"; return; }
  const opts = DELIVERY_OPTIONS[state.pickedAction.deliveryType] || DELIVERY_OPTIONS.data;
  let html = `<div class="delivery-label">Deliver: ${state.pickedAction.label}</div>`;
  for (const d of opts) {
    html += `<button class="delivery-option${d.best ? " best" : ""}" onclick="pickDelivery('${d.label}')">
      <span class="icon">${d.icon}</span>
      <div><div class="dlabel">${d.label}</div><div class="dnote">${d.note}</div></div>
      ${d.best ? '<span class="best-badge">BEST</span>' : ''}
    </button>`;
  }
  html += '<button class="back-btn" onclick="goBack()">← Back</button>';
  el.innerHTML = html;
  el.className = "delivery-picker open";
}

function renderMessages() {
  const el = document.getElementById("messages");
  el.innerHTML = state.messages.map(m => {
    const cls = m.role === "user" ? "message user" : `message ${m.role}`;
    return `<div class="${cls}"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
  }).join("");
  const main = document.getElementById("main-content");
  main.scrollTop = main.scrollHeight;
}

function renderModelDropdown() {
  const dd = document.getElementById("model-dropdown");
  dd.innerHTML = AI_MODELS.map(m =>
    `<button class="model-option${m.id === state.selectedModel ? " selected" : ""}" onclick="selectModel('${m.id}')">
      <span>${m.label}</span><span class="model-tag">${m.tag}</span>
    </button>`
  ).join("");
  dd.className = "model-dropdown" + (state.showModelPicker ? " open" : "");
  document.getElementById("model-label").textContent = AI_MODELS.find(m => m.id === state.selectedModel)?.label || "";
}

function renderExecSpinner() {
  document.getElementById("exec-spinner").className = "exec-spinner" + (state.phase === "exec" ? " visible" : "");
}

function render() {
  renderCategoryTabs();
  renderActionDrawer();
  renderDeliveryPicker();
  renderMessages();
  renderModelDropdown();
  renderExecSpinner();
  document.getElementById("history-btn").className = "icon-btn" + (state.showHistory ? " active" : "");
}

// ══════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════

function findAction(id) {
  for (const [, cat] of Object.entries(ACTIONS)) {
    for (const a of [...cat.hero, ...cat.compact]) { if (a.id === id) return a; }
  }
  return null;
}

function pickAction(id) {
  const action = findAction(id);
  if (!action) return;
  addMessage("system", "→ " + (action.label || id));
  state.pickedAction = action;
  state.phase = "delivery";
  render();
}

function pickDelivery(label) {
  state.phase = "exec";
  state.activeCat = null;
  render();
  setTimeout(() => {
    addMessage("workflow", "✓ " + state.pickedAction.label + " → via " + label);
    state.phase = "browse";
    state.pickedAction = null;
    render();
  }, 1600);
}

function goBack() {
  state.phase = "browse";
  state.pickedAction = null;
  render();
}

function rerunHistory(cmd) {
  addMessage("system", "Re-running: " + cmd);
  // Find matching action or simulate
  state.pickedAction = { id: "re", label: cmd, deliveryType: "data", tools: [], sub: "" };
  state.phase = "delivery";
  render();
}

function selectModel(id) {
  state.selectedModel = id;
  state.showModelPicker = false;
  render();
}

function addMessage(role, content) {
  state.messages.push({ role, content, timestamp: Date.now() });
  render();
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

// ══════════════════════════════════════════════════════════════
// SLASH COMMANDS (template demo)
// ══════════════════════════════════════════════════════════════
const HELP_TEXT = `Available commands:
/help — Show this help
/clear — Clear messages
/pricing — Open pricing category
/seo — Open SEO category
/product — Open product category
/research — Open research category
/automate — Open automation category
/infra — Open infrastructure category
/report — Open reports category
/comms — Open communications category
/manage — Open management category
/ailab — Open AI Lab category

Or type any question to chat with AI.`;

function processInput(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  // Category matching
  for (const key of Object.keys(CATEGORIES)) {
    if (trimmed.toLowerCase() === "/" + key) {
      state.activeCat = key;
      state.phase = "browse";
      render();
      return;
    }
  }

  if (trimmed === "/help") { addMessage("system", HELP_TEXT); return; }
  if (trimmed === "/clear") { state.messages = []; render(); return; }

  // Regular message (demo — no backend)
  addMessage("user", trimmed);
  setTimeout(() => {
    addMessage("assistant", "This is a standalone template demo. Connect your backend to enable AI responses.\n\nYou typed: `" + trimmed + "`");
  }, 800);
}

// ══════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ══════════════════════════════════════════════════════════════

const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    processInput(inputEl.value);
    inputEl.value = "";
    sendBtn.className = "send-btn";
  }
});

inputEl.addEventListener("input", () => {
  sendBtn.className = "send-btn" + (inputEl.value.trim() ? " active" : "");
});

sendBtn.addEventListener("click", () => {
  processInput(inputEl.value);
  inputEl.value = "";
  sendBtn.className = "send-btn";
});

document.getElementById("model-btn").addEventListener("click", () => {
  state.showModelPicker = !state.showModelPicker;
  renderModelDropdown();
});

document.getElementById("history-btn").addEventListener("click", () => {
  state.showHistory = !state.showHistory;
  document.getElementById("history-panel").className = "history-panel" + (state.showHistory ? " open" : "");
  document.getElementById("history-btn").className = "icon-btn" + (state.showHistory ? " active" : "");
});

document.addEventListener("mousedown", (e) => {
  if (state.showModelPicker && !document.getElementById("model-picker-wrap").contains(e.target)) {
    state.showModelPicker = false;
    renderModelDropdown();
  }
});

// ── INIT ──
render();
inputEl.focus();
</script>
