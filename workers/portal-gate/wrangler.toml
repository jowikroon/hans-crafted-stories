# Portal gate: de portal-login is de enige login voor de lab-tools.
# Zie workers/portal-gate/README.md. Los gedeployed (niet via Workers Builds,
# die bouwt alleen de root-wrangler.toml):
#   npx wrangler deploy -c workers/portal-gate/wrangler.toml
# Secrets (nooit in git): GATE_SECRET, SERVICE_CLIENT_ID, SERVICE_CLIENT_SECRET.

name = "portal-gate"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = false

routes = [
