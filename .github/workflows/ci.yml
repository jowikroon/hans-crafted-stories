name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-personal:
    name: Build personal
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - 'apps/personal/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run lint:personal
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run typecheck --workspace=@hans/personal
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run test:personal
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run build:personal
        if: steps.changes.outputs.relevant == 'true'

  build-saas:
    name: Build saas
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - 'apps/saas/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run lint:saas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run typecheck --workspace=@hans/saas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run test:saas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run build:saas
        if: steps.changes.outputs.relevant == 'true'

  build-thought-canvas:
    name: Build thought-canvas
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - 'apps/thought-canvas/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run lint:thought-canvas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run typecheck --workspace=@hans/thought-canvas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run test:thought-canvas
        if: steps.changes.outputs.relevant == 'true'

      - run: npm run build:thought-canvas
        if: steps.changes.outputs.relevant == 'true'

  post-commit-check:
    name: Post-commit health (empire-health)
    runs-on: ubuntu-latest
    needs: [build-personal, build-saas, build-thought-canvas]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # empire-health (_shared/auth.ts) accepts the project's public anon key in
      # the apikey header, so no repo secret is needed. The URL and key come from
      # the committed apps/personal/.env.production (both are public by design).
      - name: Call empire-health agent
        run: |
          SUPABASE_URL=$(grep -m1 '^VITE_SUPABASE_URL=' apps/personal/.env.production | cut -d'"' -f2)
          SUPABASE_ANON_KEY=$(grep -m1 '^VITE_SUPABASE_PUBLISHABLE_KEY=' apps/personal/.env.production | cut -d'"' -f2)
          res=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/functions/v1/empire-health")
          code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')
          echo "empire-health response ($code): $body"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Post-commit health check failed (non-2xx)"
            exit 1
          fi
