# Public CMS stamp check. Missing data and API failures must fail closed.
name: Content redeploy watch (hansvanleeuwen.com)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Controleer zonder stamp-commit of redeploy"
        type: boolean
        default: true
  pull_request:
    paths:
      - ".github/workflows/content-redeploy.yml"
      - "scripts/content_redeploy_watch.py"
      - "scripts/test_content_redeploy_watch.py"

permissions:
  contents: read

concurrency:
  group: content-redeploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test succesvolle controle en onbereikbare Supabase
        run: python3 -m unittest discover -s scripts -p test_content_redeploy_watch.py -v

  watch:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Review/manual runs inspect their own revision. Only main may push a stamp.
          persist-credentials: false

      - name: Lees en valideer publicatiestamp via expliciete Supabase-configuratie
        id: stamp
        env:
          CONTENT_SUPABASE_URL: ${{ vars.CONTENT_SUPABASE_URL }}
          CONTENT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CONTENT_SUPABASE_PUBLISHABLE_KEY || vars.CONTENT_SUPABASE_PUBLISHABLE_KEY }}
          CHECK_ONLY: ${{ github.ref != 'refs/heads/main' || (github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.check_only)) }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CHECK_ONLY" = "true" ]; then args+=(--check-only); fi
          python3 scripts/content_redeploy_watch.py "${args[@]}"

      - name: Push uitsluitend een geverifieerde gewijzigde main-stamp
        if: >-
          success() && steps.stamp.outputs.verified == 'true' &&
          steps.stamp.outputs.changed == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs.check_only == false))
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE=apps/personal/.content-deploy-stamp
          # Refuse concurrent main changes, rather than overwrite or silently rebase.
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "main is gewijzigd; geen stamp-update, volgende controle opnieuw proberen"
            exit 1
          }
          printf '%s\n' "$STAMP" > "$FILE"
          git config user.name "content-redeploy-bot"
          git config user.email "hansvl3@gmail.com"
          git add -- "$FILE"
          git commit -m "chore(content): redeploy — blog_posts ${STAMP} (auto)"
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
          echo "Geverifieerde stamp gepusht; Vercel kan main opnieuw bouwen." >> "$GITHUB_STEP_SUMMARY"
